version: 2
project_name: skillmod

builds:
  - id: skillmod
    main: .
    binary: skillmod
    env:
      - CGO_ENABLED=0
    # .Version omits the leading "v"; .Tag is the exact release tag and is
    # injected so the CLI and SKILL store use the same canonical version.
    ldflags:
      - -X main.version={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
  algorithm: sha256
