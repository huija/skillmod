name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, race: "-race" }
          - { os: macos-latest, race: "-race" }
          - { os: windows-latest, race: "" }
    uses: ./.github/workflows/test.yml
    with:
      os: ${{ matrix.os }}
      race: ${{ matrix.race }}

  cross:
    uses: ./.github/workflows/cross.yml
